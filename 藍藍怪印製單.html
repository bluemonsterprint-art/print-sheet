    --field:#151c25;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121820; --panel:#1b232d; --ink:#e4ebf2; --muted:#9aa9b8; --line:#2f3b48;
  --accent:#5aa2e6; --accent-ink:#0d1620; --accent-soft:#1d3148; --warn:#f08a80; --warn-soft:#3a1f1d; --ok:#6fcf97;
  --field:#151c25;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;font-size:14px;padding-inline:16px;padding-block:20px 40px;margin:0}
.wrap{max-width:1440px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;margin-bottom:16px}
h1{font-size:20px;margin:0;font-weight:700}
h1.brand{display:flex;align-items:center;gap:8px}
h1.brand img{width:30px;height:30px}
header p{margin:0;color:var(--muted)}
.grid{display:grid;grid-template-columns:230px minmax(0,380px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:1180px){.grid{grid-template-columns:220px minmax(0,1fr)}.preview{grid-column:1 / -1}}
@media (max-width:700px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:14px}

/* order list */
.orders{padding:12px;gap:10px}
.orders .new{width:100%}
.olist{display:flex;flex-direction:column;gap:2px;max-height:70vh;overflow:auto;margin:0 -4px;padding:0 4px}
@media (max-width:700px){.olist{max-height:220px}}
.oitem{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid transparent;background:transparent;padding:8px 10px;border-radius:6px;width:100%}
.oitem:hover{background:var(--field)}
.oitem[aria-current=true]{background:var(--accent-soft);border-color:var(--accent)}
.oitem .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oitem .m{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:13px;padding:8px 4px}
.status{font-size:12px;color:var(--muted);min-height:1.2em}
.status.err{color:var(--warn)}
.bk{border-top:1px solid var(--line);padding-top:10px}
.dirbox{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.dirbox .dirname{font-size:12px;color:var(--muted);word-break:break-all}
.dirbox button{flex:1;padding:6px 8px;font-size:12px}
.bk button{flex:1;padding:6px 8px;font-size:12px}
.bk{border-top:1px solid var(--line);padding-top:10px}
.bk button{flex:1;padding:6px 8px;font-size:12px}

.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-weight:600;font-size:13px}
.hint{color:var(--muted);font-size:12px;font-weight:400}
textarea,input[type=text],input[type=number],input[type=search]{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:6px;padding:8px 10px;line-height:1.55}
textarea{resize:vertical}
textarea:focus,input:focus,button:focus-visible,.drop:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.drop{border:1.5px dashed var(--line);border-radius:8px;padding:12px;text-align:center;color:var(--muted);cursor:pointer;background:var(--field)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop input{display:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:2px 10px;font-size:12px;font-variant-numeric:tabular-nums}
.check{font-size:13px;padding:8px 10px;border-radius:6px}
.check.bad{background:var(--warn-soft);color:var(--warn)}
.check.good{color:var(--ok);padding:0}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:8px 14px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.danger{color:var(--warn);border-color:var(--warn)}
button.danger.solid{background:var(--warn);color:var(--panel)}
button:disabled{opacity:.5;cursor:wait}
.formhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px}
.formhead strong{font-size:15px}
.tabs{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.tab{border-radius:6px 6px 0 0;border-bottom:none}
.tab[aria-selected=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tabs .sp{flex:1}
.stage{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
label.inline{display:flex;gap:6px;align-items:center;font-size:13px;cursor:pointer}

/* ---- the sheet itself: always a white paper document ---- */
.sheet{width:640px;background:#fff;color:#222;font-family:"Microsoft JhengHei","Noto Sans TC","PingFang TC",sans-serif;font-size:17px;line-height:1.75;padding:18px 22px 22px;margin:0 auto}
.sheet .blk{white-space:pre-wrap;word-break:break-word}
.sheet .dash{color:#555;letter-spacing:-1px;overflow:hidden;white-space:nowrap}
.sheet .red{color:#ff0000}
.sheet mark{background:#ffff00;color:inherit;padding:0 1px}
.sheet mark.mat{color:#ff0000;background:#ffff00;font-weight:700;padding:0 3px}
.sheet .fac-tag{display:inline-block;border:2px solid #222;padding:0 10px;font-weight:700;margin-bottom:6px;font-size:15px}
.sheet table{border-collapse:collapse;width:100%;margin-top:6px}
.sheet td{border:1.5px solid #333;vertical-align:top}
.sheet td.img{width:74%;padding:4px}
.sheet table.itbl{table-layout:fixed}
.sheet table.itbl+table.itbl{margin-top:-1.5px}
.sheet table.hasro td.img{width:48%}
.sheet td.sz .szl{display:flex;flex-direction:column;gap:22px}
.sheet table.roster{width:100%;margin:0;border-collapse:collapse;font-size:14px;line-height:1.3;table-layout:auto}
.sheet table.roster th,.sheet table.roster td{border:1px solid #666;padding:2px 4px;text-align:center;vertical-align:middle;word-break:break-all}
.sheet table.roster th{font-weight:700;background:#f2f2f2}
.sheet td.sz>.iname{margin-bottom:22px}
.sheet table.hasro td.sz>.iname{margin-bottom:6px;line-height:1.4}
.sheet .rsum{margin-top:8px;font-size:15px;line-height:1.6}
.rdet summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--accent)}
.wordbtn{display:block;text-align:center;border:1px solid var(--accent);color:var(--accent);background:var(--panel);border-radius:6px;padding:7px 10px;font-size:13px;font-weight:600;cursor:pointer}
.wordbtn:hover{background:var(--accent-soft)}
.wordbtn:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.wordbtn input{display:none}
.wordmsg:empty{display:none}
.rdet[open] summary{margin-bottom:6px}
.rdet .hint{margin-top:4px}
.i-size:disabled{opacity:.55}
.sheet td.img{text-align:center;font-size:0}
.sheet td.img img{display:inline-block;vertical-align:middle;max-width:100%;margin:2px 0}
.thumb select{font:inherit;font-size:12px;padding:3px 4px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink);width:100%}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.items{display:flex;flex-direction:column;gap:12px}
.item{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}
.item .ihead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.item .ihead button{padding:4px 10px;font-size:12px}
.sheet .iname{font-weight:700}
.sheet .red.b,.oitem .red.b{font-weight:700}
.oitem .red{color:var(--warn)}
.rushrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rushrow input[type=text]{flex:1;min-width:150px;width:auto}
.rushrow input:disabled{opacity:.5}
.rushchk{font-weight:700;color:var(--warn)}
.rushbadge{display:inline-block;background:var(--warn);color:var(--panel);border-radius:4px;font-size:11px;padding:0 5px;margin-right:6px;vertical-align:1px}
.calcrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.calc{border:1px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px}
.calc-head{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.cgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cgrid.c2{grid-template-columns:1fr 1.4fr}
@media (max-width:420px){.cgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cgrid label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600}
.cgrid input,.xrow input{width:100%;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-variant-numeric:tabular-nums}
.extras{display:flex;flex-direction:column;gap:6px}
.xrow{display:grid;grid-template-columns:1.4fr 1fr .7fr auto;gap:6px}
button.small{padding:5px 10px;font-size:12px}
.cres{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--panel);border-radius:6px;padding:8px 10px}
.cres div{display:flex;flex-direction:column;gap:2px}
.cres span{font-size:12px;color:var(--muted)}
.cres b{font-size:18px;font-variant-numeric:tabular-nums}
.cres .bal b{color:var(--accent)}
.cres .expr{grid-column:1/-1;font-size:12px;color:var(--muted);word-break:break-all}
.calcrow button{padding:5px 10px;font-size:12px}
.hint.warn{color:var(--warn)}
.hint.ok{color:var(--ok)}
.sheet tr+tr td{border-top-width:2px}
.thumb{width:calc(50% - 4px);border:1px solid var(--line);border-radius:6px;padding:6px;display:flex;flex-direction:column;gap:4px;background:var(--field)}
.thumb img{width:100%;height:90px;object-fit:contain;background:#fff;border-radius:4px}
.thumb span{font-size:12px;color:var(--muted)}
.thumb .tb{display:flex;gap:4px}
.thumb .tb button{flex:1;padding:3px 6px;font-size:12px}
.sheet td.img .noimg{height:340px;display:flex;align-items:center;justify-content:center;color:#999;font-size:15px}
.sheet td.sz{padding:10px 12px;font-size:18px;line-height:1}
.sheet .szl{display:flex;flex-direction:column;gap:22px;font-variant-numeric:tabular-nums}
.sheet .note{margin-top:8px;white-space:pre-wrap}
.sheet .alert{border:3px solid #ff0000;color:#ff0000;font-weight:700;font-size:19px;padding:4px 12px;margin:6px 0 4px;white-space:pre-wrap;word-break:break-word}

.overlay{position:fixed;inset:0;background:rgba(10,16,24,.72);display:flex;align-items:flex-start;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 16px 20px;overflow:auto;z-index:10}
.modal{background:var(--panel);border-radius:10px;padding:16px;max-width:720px;width:100%;display:flex;flex-direction:column;gap:12px}
.modal img{width:100%;border:1px solid var(--line);border-radius:4px;background:#fff}
.modal .top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.toast{font-size:13px;color:var(--ok);min-height:1em}
.actbar{display:none}
@media (max-width:1180px){
  .actbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;position:fixed;left:0;right:0;bottom:0;z-index:5;
    background:var(--panel);border-top:1px solid var(--line);box-shadow:0 -4px 14px rgba(0,0,0,.08);
    padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px))}
  .actbar button{padding:7px 12px}
  .actbar .seg{display:flex}
  .actbar .seg button{border-radius:0}
  .actbar .seg button:first-child{border-radius:6px 0 0 6px}
  .actbar .seg button:last-child{border-radius:0 6px 6px 0;border-left:none}
  .actbar .seg button[aria-selected=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  body{padding-bottom:110px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>

  </header>

  <div class="grid">
    <!-- 訂單清單 -->
    <div class="panel orders">
      <button class="primary new" id="b-new">＋ 新增訂單</button>
      <input type="search" id="q" placeholder="搜尋訂單名稱" aria-label="搜尋訂單">
      <div class="olist" id="olist"><div class="empty">載入中…</div></div>
      <div class="status" id="dbstatus"></div>
      <div class="btns bk"><button id="b-export">匯出備份</button><button id="b-import">匯入備份</button><input type="file" id="f-backup" accept=".json,application/json" hidden></div>
    </div>

    <!-- 表單 -->
    <div class="panel" id="form">
      <div class="formhead">
        <strong id="fh-title">訂單內容</strong>
        <div class="btns">
          <span class="status" id="savestatus"></span>
          <button class="danger" id="b-del">刪除</button>
          <button class="danger solid" id="b-del-yes" hidden>確定刪除</button>
          <button id="b-del-no" hidden>取消</button>
        </div>
      </div>
      <div class="field">
        <label for="f-user">用戶／訂單名稱</label>
        <input type="text" id="f-user" placeholder="例如：馨頻 墾丁國小五甲">
        <div class="rushrow">
          <label class="inline rushchk"><input type="checkbox" id="f-rush"> 趕時間</label>
          <input type="text" id="f-rushdate" placeholder="幾號前要收到，例如 10/27" aria-label="趕件日期">
        </div>
      </div>
      <div class="field">
        <label for="f-ship">收件資料 <span class="hint">（只出現在客戶版）</span></label>
        <textarea id="f-ship" rows="3" placeholder="收件人：&#10;電話：&#10;地址："></textarea>
      </div>
      <div class="calc" id="calc">
        <div class="calc-head"><strong>金額計算機</strong><span class="hint">填數字自動算，按「填入金額資料」就會寫進下面</span></div>
        <div class="cgrid">
          <label>單價<input type="number" id="c-price" min="0" inputmode="decimal" placeholder="350"></label>
          <label>數量<input type="number" id="c-qty" min="0" inputmode="numeric"></label>
          <label>送幾件<input type="number" id="c-free" min="0" inputmode="numeric" placeholder="0"></label>
          <label>運費<input type="number" id="c-ship" min="0" inputmode="decimal" placeholder="0"></label>
        </div>
        <label class="inline"><input type="checkbox" id="c-freeship"> 免運</label>
        <div class="extras" id="c-extras"></div>
        <button id="c-addextra" class="small">＋ 加價／折扣項目</button>
        <div class="cgrid c2">
          <label>訂金<input type="number" id="c-dep" min="0" inputmode="decimal" placeholder="3000"></label>
          <label>訂金備註<input type="text" id="c-depnote" placeholder="已付 / 9/14"></label>
        </div>
        <div class="cres" id="c-res"></div>
        <div class="btns"><button class="primary small" id="c-apply">填入金額資料</button><button class="small" id="c-clear">清空計算機</button></div>
      </div>
      <div class="field">
        <label for="f-money">金額資料 <span class="hint">（只出現在客戶版；用 ** 包起來的字會變紅色）</span></label>
        <textarea id="f-money" rows="5" placeholder="數量：28 件     350/件     **滿 25 送一件+運**&#10;總金額：350*27+急件費35*28=&#10;訂金：3000(已付)&#10;尾款："></textarea>
        <div class="calcrow"><button id="b-calc">自動計算金額</button><span class="hint" id="calc-hint">算式寫在「=」前面，按一下就會算好總金額和尾款</span></div>
      </div>
      <div class="row2">
        <div class="field">
          <label for="f-mat">衣服材質</label>
          <input type="text" id="f-mat" list="mats">
          <datalist id="mats">
            <option value="長孔絲光排汗衫"></option>
            <option value="冰涼排汗衫"></option>
            <option value="精梳棉T"></option>
            <option value="吸濕排汗POLO衫"></option>
            <option value="涼感網眼布"></option>
          </datalist>
        </div>
        <div class="field">
          <label for="f-count">衣服件數 <span class="hint">（空白＝自動加總）</span></label>
          <input type="number" id="f-count" min="0" placeholder="自動">
        </div>
      </div>
      <div class="field">
        <span class="lbl">品項 <span class="hint">（每個品項有自己的稿圖和尺寸；單位寫「套」就會顯示套）</span></span>
        <div class="items" id="items"></div>
        <button id="b-additem">＋ 新增品項</button>
        <div id="check" class="check"></div>
      </div>
      <div class="field">
        <label for="f-alert">特別提醒 <span class="hint">（客戶版、工廠版都會出現，紅框紅字；一行一條）</span></label>
        <textarea id="f-alert" rows="2" placeholder="例如：左胸圖案有調整大小及位置"></textarea>
      </div>
      <div class="field">
        <label for="f-note">工廠備註 <span class="hint">（只出現在工廠版，可留空）</span></label>
        <textarea id="f-note" rows="2" placeholder="例如：交期 10/15、領口加車標"></textarea>
      </div>
      <label class="inline"><input type="checkbox" id="f-facname" checked> 工廠版顯示用戶／訂單名稱</label>
    </div>

    <!-- 預覽 -->
    <div class="preview">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="t-cus" aria-selected="true">客戶版</button>
        <button class="tab" role="tab" id="t-fac" aria-selected="false">工廠版</button>
        <span class="sp"></span>
        <button class="primary" id="b-img">產生圖片</button>
        <button class="primary" id="b-doc">下載 Word</button>
        <button id="b-txt">複製文字</button>
      </div>
      <div class="stage"><div id="sheet" class="sheet"></div></div>
    </div>
  </div>
</div>

<div class="actbar" id="actbar">
  <div class="seg"><button data-proxy="t-cus">客戶版</button><button data-proxy="t-fac">工廠版</button></div>
  <button class="primary" data-proxy="b-img">產生圖片</button>
  <button class="primary" data-proxy="b-doc">下載 Word</button>
  <button data-proxy="b-txt">複製文字</button>
  <button data-jump="1" aria-label="看預覽">看預覽 ↓</button>
</div>

<div class="overlay" id="ov" hidden>
  <div class="modal">
    <div class="top">
      <strong id="ov-title">圖片</strong>
      <div class="btns">
        <button class="primary" id="ov-copy">複製圖片</button>
        <button id="ov-save" hidden>下載圖片</button>
        <button id="ov-close">關閉</button>
      </div>
    </div>
    <div class="toast" id="ov-toast"></div>
    <img id="ov-img" alt="印製單圖片">
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const FIELDS = ['user','ship','money','size','mat','count','note'];
const DASH = '-'.repeat(38);

const BLANK_CALC = () => ({price:'',qty:'',free:'',ship:'',freeShip:false,extras:[],deposit:'',depNote:''});
const BLANK = () => ({calc:BLANK_CALC(),rush:false,rushDate:'',user:'',ship:'',money:'',size:'',mat:'長孔絲光排汗衫',count:'',note:'',alert:'',facname:true,imgId:'',imgData:'',imgs:[],items:[BLANK_ITEM()]});
const MAX_IMGS=4, IMG_LIMIT=600000;

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmt(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<span class="red">$1</span>')}
function imgItems(o){
  if(Array.isArray(o.imgs) && o.imgs.length) return o.imgs;
  if(o.imgId) return [{id:o.imgId}];
  if(o.imgData) return [{data:o.imgData}];
  return [];
}
function itemSrc(x){return x.id ? '/_blob/'+x.id : (x.data||'')}
function imgW(x){const w=+x.w; return w>=20&&w<=100?w:100;}
const SIZES=[100,90,80,70,60,50,40,30];
function imgSrcs(o){return imgItems(o).map(itemSrc).filter(Boolean)}
/* 多品項：舊訂單（只有一組尺寸和稿圖）自動變成第 1 個品項 */
function itemsOf(o){
  if(Array.isArray(o.items) && o.items.length) return o.items;
  return [{name:'', size:o.size||'', imgs:imgItems(o)}];
}
function toCur(o){

  delete c.id;
  c.items=itemsOf(src).map(it=>({name:it.name||'', size:it.size||'', imgs:[...(it.imgs||[])], roster:it.roster||''}));

  return c;
}
function allImgIds(o){ return itemsOf(o).flatMap(it=>(it.imgs||[]).map(x=>x.id)).filter(Boolean); }
function unitOf(it){ return /套/.test(it.size||'') ? '套' : '件'; }
/* ---------- 名單（每件名字／號碼不同） ---------- */
const SIZE_RE=/^(?:\d*X*[SML]|XS|XXS|F|FREE|\d{2,3}(?:號|cm)?)$/i;
const SIZE_ORDER=['XXS','XS','S','M','L','XL','2XL','3XL','4XL','5XL','6XL','7XL','8XL'];
const HEAD_RE=/件數|編號|序號|項次|名字|姓名|名稱|號碼|背號|尺寸|尺碼|size|備註|NO\.?$/i;
function parseRoster(text){
  const raw=String(text||'').split(/\r?\n/).map(l=>l.replace(/\s+$/,'')).filter(l=>l.trim());
  if(!raw.length) return null;
  const split=l=> l.includes('\t') ? l.split('\t').map(x=>x.trim()) : l.includes(',')||l.includes('，') ? l.split(/[,，]/).map(x=>x.trim()) : l.trim().split(/\s{2,}|\s+(?=\S+$)/).map(x=>x.trim());
  let rows=raw.map(split);
  const ncol=Math.max(...rows.map(r=>r.length));
  rows=rows.map(r=>{while(r.length<ncol) r.push(''); return r;});
  let header=null;
  if(rows[0].some(c=>HEAD_RE.test(c)) && !rows[0].some(c=>SIZE_RE.test(c.replace(/\s/g,'')))){ header=rows.shift(); }
  if(!rows.length) return null;
  // 找尺寸欄：符合尺寸格式最多的那一欄
  let sizeCol=-1, best=0;
  for(let c=0;c<ncol;c++){ const n=rows.filter(r=>SIZE_RE.test(r[c].replace(/\s/g,''))).length; if(n>best){best=n;sizeCol=c;} }
  if(best < Math.max(1, rows.length*0.5)) sizeCol=-1;
  const counts={};
  if(sizeCol>=0) rows.forEach(r=>{ const k=normSize(r[sizeCol]); if(k) counts[k]=(counts[k]||0)+1; });
  const keys=Object.keys(counts).sort((a,b)=>{const ia=SIZE_ORDER.indexOf(a), ib=SIZE_ORDER.indexOf(b); return (ia<0?99:ia)-(ib<0?99:ib) || a.localeCompare(b,'zh-Hant',{numeric:true});});
  return {header, rows, ncol, sizeCol, sizes:keys.map(k=>({k,n:counts[k]})), count:rows.length};
}
function itemSizes(it){ const r=parseRoster(it.roster); return r&&r.sizeCol>=0 ? r.sizes : parseSizes(it.size); }
function itemSum(it){ const r=parseRoster(it.roster); if(r) return r.count; return parseSizes(it.size).reduce((a,b)=>a+b.n,0); }
function totals(o){
  const t={}; itemsOf(o).forEach(it=>{const n=itemSum(it); if(n){const u=unitOf(it); t[u]=(t[u]||0)+n;}});
  return t;
}
function totalText(o){
  const manual=String(o.count||'').trim(); const t=totals(o); const us=Object.keys(t);
  if(manual) return manual+' '+(us.length===1?us[0]:'件');
  if(!us.length) return '0 件';
  return us.map(u=>t[u]+' '+u).join(' + ');
}
function totalNum(o){ return Object.values(totals(o)).reduce((a,b)=>a+b,0); }

/* ---------- 尺寸解析 ---------- */
function normSize(k){
  k = k.toUpperCase().replace(/\s/g,'');
  const m = k.match(/^(X+)L$/); if(m && m[1].length>1) return m[1].length+'XL';
  return k;
}
function parseSizes(t){
  const out = []; const seen = {};
  const add = (k,n)=>{k=normSize(k); if(seen[k]!=null){out[seen[k]].n+=n}else{seen[k]=out.length;out.push({k,n})}};
  // 分隔符號可以是 ：: = * ＊ × 或前後有空白的 x，例如 S：5、S*5、S×5、S x 5
  let re = /([0-9]*X*[SML]|XS|F|FREE|\d{2,3}(?:號|cm|CM)?|[一-鿿]{1,4}(?:[A-Za-z0-9]{0,4}))(?:\s*[:：=*＊×]\s*|\s+[xX]\s*)(\d+)/gi, m, hit=false;
  while((m=re.exec(t||''))){hit=true; add(m[1], +m[2]);}
  if(!hit){
    re = /\b([0-9]*X*[SML]|XS)\s*(\d+)/gi;
    while((m=re.exec(t||''))) add(m[1], +m[2]);
  }
  return out;
}
function rushText(o){ if(!o.rush) return ''; const d=String(o.rushDate||'').trim(); return '★趕時間★'+(d?` 請在 ${d} 前收到`:''); }
// 打勾趕時間時，名稱變成「★趕時間★名稱 (趕10/27前收到)」
function rushParts(o){ const d=String(o.rushDate||'').trim(); return o.rush ? {pre:'★趕時間★', post:d?` (趕${d}前收到)`:''} : {pre:'',post:''}; }
function displayName(o){ const n=String(o.user||'').trim(); const r=rushParts(o); return r.pre+n+r.post; }
function nameHTML(o){ const n=esc(String(o.user||'').trim()); const r=rushParts(o); return o.rush ? `<span class="red b">${r.pre}</span>${n}<span class="red b">${esc(r.post)}</span>` : n; }
function alertLines(o){return String(o.alert||'').split(/\n/).map(l=>l.trim().replace(/^★+|★+$/g,'').trim()).filter(Boolean);}
function orderQty(t){const m=(t||'').match(/數量\s*[:：]\s*共?\s*(\d+)/);return m?+m[1]:null}
/* ---------- 金額計算 ---------- */
// 只留數字和 + - * / ( )，其他文字（例如「急件費」）略過
function evalExpr(src){
  let t=String(src).replace(/[＋]/g,'+').replace(/[－−]/g,'-').replace(/[＊×xX]/g,'*').replace(/[÷／]/g,'/').replace(/[（]/g,'(').replace(/[）]/g,')')
    .replace(/(\d),(?=\d{3}\b)/g,'$1').replace(/[^0-9+\-*/().]/g,'');
  t=t.replace(/^[+*/]+|[+\-*/]+$/g,'');
  if(!/\d/.test(t) || !/[+\-*/]/.test(t.replace(/^-/,''))) return null;
  let i=0;
  const peek=()=>t[i];
  function num(){ if(peek()==='('){i++; const v=add(); if(peek()===')')i++; return v;} if(peek()==='-'){i++; return -num();} let j=i; while(i<t.length&&/[0-9.]/.test(t[i]))i++; if(j===i) throw 0; return parseFloat(t.slice(j,i)); }
  function mul(){ let v=num(); while(peek()==='*'||peek()==='/'){ const o=t[i++]; const r=num(); v=o==='*'?v*r:v/r; } return v; }
  function add(){ let v=mul(); while(peek()==='+'||peek()==='-'){ const o=t[i++]; const r=mul(); v=o==='+'?v+r:v-r; } return v; }
  try{ const v=add(); if(i!==t.length||!isFinite(v)) return null; return Math.round(v*100)/100; }catch(e){ return null; }
}
function firstNum(s){ const m=String(s).match(/-?\d[\d,]*(?:\.\d+)?/); return m?parseFloat(m[0].replace(/,/g,'')):null; }
function fmtNum(v,comma){ return comma ? v.toLocaleString('en-US') : String(v); }
function calcMoney(text){
  const lines=String(text||'').split('\n'); let total=null, deposit=null, balIdx=-1; const notes=[];
  lines.forEach((ln,idx)=>{
    const m=ln.match(/^(\s*[^:：]*[:：])(.*)$/); if(!m) return;
    const label=m[1], body=m[2];
    if(/尾款/.test(label)){ balIdx=idx; return; }
    if(/訂金|已付|預付/.test(label)){ const n=firstNum(body); if(n!=null) deposit=n; return; }
    const eq=body.lastIndexOf('=')>=0?body.lastIndexOf('='):body.lastIndexOf('＝');
    if(eq>=0){
      const v=evalExpr(body.slice(0,eq)); if(v==null) return;
      const right=body.slice(eq+1); const old=firstNum(right);
      const comma=/\d,\d{3}/.test(right); const suffix=right.replace(/^\s*-?\d[\d,]*(?:\.\d+)?/,'');
      if(old!==v){ lines[idx]=label+body.slice(0,eq+1)+fmtNum(v,comma)+(old==null?(right.trim()?right:''):suffix); if(old!=null) notes.push(`${label.replace(/[:：]/,'')}原本寫 ${old}，算出來是 ${v}`); }
      if(/總金額|總計|合計|總價/.test(label)) total=v;
    } else if(/總金額|總計|合計|總價/.test(label)){
      const v=evalExpr(body);
      if(v!=null){ lines[idx]=label+body.replace(/\s+$/,'')+'='+v; total=v; }
      else { const n=firstNum(body); if(n!=null) total=n; }
    }
  });
  let balance=null;
  if(balIdx>=0 && total!=null){
    balance=Math.round((total-(deposit||0))*100)/100;
    const m=lines[balIdx].match(/^(\s*[^:：]*[:：])(.*)$/); const body=m[2]; const old=firstNum(body);
    const comma=/\d,\d{3}/.test(body)||/\d,\d{3}/.test(text.match(/總金額[^\n]*/)?.[0]||'');
    if(old!==balance){
      lines[balIdx]= old==null ? m[1]+fmtNum(balance,comma)+(body.trim()?' '+body.trim():'') : m[1]+body.replace(/-?\d[\d,]*(?:\.\d+)?/,fmtNum(balance,comma));
      if(old!=null) notes.push(`尾款原本寫 ${old}，算出來是 ${balance}`);
    }
  }
  return {text:lines.join('\n'), total, deposit, balance, notes};
}
/* ---------- 金額計算機 ---------- */
const N=v=>{const x=parseFloat(String(v).replace(/,/g,'')); return isFinite(x)?x:0;};
const R=v=>Math.round(v*100)/100;
function calcState(){ if(!cur.calc) cur.calc=BLANK_CALC(); if(!Array.isArray(cur.calc.extras)) cur.calc.extras=[]; return cur.calc; }
function calcResult(){
  const c=calcState();
  const qty = String(c.qty).trim()!=='' ? N(c.qty) : totalNum(cur);
  const free=N(c.free), price=N(c.price), ship=c.freeShip?0:N(c.ship);
  const paidQty=Math.max(0,qty-free);
  const parts=[]; let total=0;
  if(price){ parts.push(`${fmtN(price)}*${paidQty}`); total+=price*paidQty; }
  c.extras.forEach(e=>{ const p=N(e.price); if(!p) return; const q=String(e.qty).trim()!==''?N(e.qty):qty; total+=p*q;
    const name=(e.name||'').trim(); parts.push(`${p<0?'-':'+'}${name}${fmtN(Math.abs(p))}*${q}`); });
  if(ship){ parts.push(`+運費${fmtN(ship)}`); total+=ship; }
  total=R(total); const dep=N(c.deposit);
  return {qty,free,price,ship,paidQty,total,dep,balance:R(total-dep),expr:parts.join('').replace(/^\+/,'')};
}
function fmtN(v){ return String(R(v)); }
function money(v){ return R(v).toLocaleString('en-US'); }
function calcText(){
  const c=calcState(), r=calcResult(); const L=[];
  const promo=[]; if(r.free) promo.push(`送${r.free<=10&&r.free===Math.floor(r.free)?'零一二三四五六七八九十'[r.free]:r.free}件`); if(c.freeShip) promo.push('免運');
  if(promo.length) L.push(promo.join('+'));
  L.push(`數量：共${r.qty}件`);
  L.push(`總金額：${r.expr}=${r.total}`);
  if(String(c.deposit).trim()!=='') L.push(`訂金：${r.dep}${(c.depNote||'').trim()?`(${c.depNote.trim()})`:''}`);
  L.push(`尾款：${r.balance}`);
  return L.join('\n');
}
function renderCalcForm(){
  const c=calcState();
  $('c-price').value=c.price; $('c-qty').value=c.qty; $('c-free').value=c.free; $('c-ship').value=c.ship;
  $('c-freeship').checked=!!c.freeShip; $('c-dep').value=c.deposit; $('c-depnote').value=c.depNote||'';
  $('c-extras').innerHTML=c.extras.map((e,i)=>`<div class="xrow" data-x="${i}">
    <input type="text" data-k="name" value="${esc(e.name||'')}" placeholder="項目，例如：急件費" aria-label="加價項目名稱">
    <input type="number" data-k="price" value="${esc(e.price??'')}" placeholder="單價（折扣打負數）" aria-label="加價單價">
    <input type="number" data-k="qty" value="${esc(e.qty??'')}" placeholder="數量" aria-label="加價數量">
    <button data-k="rm" class="danger small" aria-label="移除">✕</button></div>`).join('');
  renderCalcResult();
}
function renderCalcResult(){
  const r=calcResult();
  $('c-qty').placeholder = totalNum(cur) ? String(totalNum(cur)) : '28';
  $('c-res').innerHTML = r.price||r.ship||calcState().extras.length ? `
    <div><span>總金額</span><b>${money(r.total)}</b></div>
    <div><span>訂金</span><b>${money(r.dep)}</b></div>
    <div class="bal"><span>尾款</span><b>${money(r.balance)}</b></div>
    <div class="expr">${esc(r.expr)}=${r.total}</div>` : '<div class="expr">填入單價就會開始計算</div>';
}
[['c-price','price'],['c-qty','qty'],['c-free','free'],['c-ship','ship'],['c-dep','deposit'],['c-depnote','depNote']].forEach(([id,k])=>$(id).addEventListener('input',e=>{calcState()[k]=e.target.value; renderCalcResult(); scheduleSave();}));
$('c-freeship').addEventListener('change',e=>{calcState().freeShip=e.target.checked; renderCalcResult(); scheduleSave();});
$('c-extras').addEventListener('input',e=>{const row=e.target.closest('.xrow'); if(!row) return; calcState().extras[+row.dataset.x][e.target.dataset.k]=e.target.value; renderCalcResult(); scheduleSave();});
$('c-extras').addEventListener('click',e=>{const b=e.target.closest('button[data-k="rm"]'); if(!b) return; calcState().extras.splice(+b.closest('.xrow').dataset.x,1); renderCalcForm(); scheduleSave();});
$('c-addextra').onclick=()=>{ calcState().extras.push({name:'',price:'',qty:''}); renderCalcForm(); const rows=$('c-extras').querySelectorAll('.xrow'); rows[rows.length-1]?.querySelector('input')?.focus(); scheduleSave(); };
$('c-clear').onclick=()=>{ cur.calc=BLANK_CALC(); renderCalcForm(); scheduleSave(); };
$('c-apply').onclick=()=>{
  if(!N(calcState().price) && !calcState().extras.length){ flash($('c-apply'),'請先填單價'); return; }
  cur.money=calcText(); $('f-money').value=cur.money; renderPreview(); scheduleSave(); flash($('c-apply'),'已填入');
};
function renderCalcHint(){
  const r=calcMoney(cur.money); const h=$('calc-hint');
  if(r.text!==cur.money){ h.className='hint warn'; h.textContent = r.notes.length ? '⚠ '+r.notes.join('；')+'，按左邊按鈕更新' : '有算式還沒算，按左邊按鈕更新'; }
  else if(r.total!=null){ h.className='hint ok'; h.textContent=`✓ 總金額 ${r.total}`+(r.deposit!=null?`，訂金 ${r.deposit}`:'')+(r.balance!=null?`，尾款 ${r.balance}`:''); }
  else { h.className='hint'; h.textContent='算式寫在「=」前面，按一下就會算好總金額和尾款'; }
}

/* ---------- 印製單 ---------- */
function sheetHTML(o, which){
  let h = '';
  if(which==='cus'){
    h += `<div class="blk">用戶：${nameHTML(o)}</div><div class="dash">${DASH}</div>`;
    if(o.ship.trim()) h += `<div class="blk">${fmt(o.ship.trim())}</div><div class="dash">${DASH}</div>`;
    if(o.money.trim()) h += `<div class="blk">${fmt(o.money.trim())}</div><div class="dash">${DASH}</div>`;
    h += `<div class="blk">以下為印製單請務必詳細確認<mark>件數/尺寸/圖稿</mark>是否正確</div>`;
  } else {
    h += `<div class="fac-tag">工廠印製單</div>`;
    if(o.facname && o.user.trim()) h += `<div class="blk">訂單：${nameHTML(o)}</div>`;
    else if(o.rush) h += `<div class="blk">${nameHTML(o)}</div>`;
  }
  h += `<div class="blk">衣服件數：${esc(totalText(o))}</div>`;
  h += `<div class="blk">衣服材質：<mark class="mat">${esc(o.mat.trim())}</mark></div>`;
  if(which==='fac' && o.note.trim()) h += `<div class="blk note">備註：${fmt(o.note.trim())}</div>`;
  const al=alertLines(o);
  if(al.length) h += `<div class="alert">${al.map(l=>'★★★'+esc(l)+'★★★').join('\n')}</div>`;
  const rows = itemsOf(o).map((it,ii)=>{
    const u=unitOf(it); const sizes=itemSizes(it); const ro=parseRoster(it.roster);
    const name=(it.name||'').trim();
    let sz;
    if(ro){
      const head = ro.header ? `<tr>${ro.header.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>` : '';
      sz = (name?`<div class="iname">${esc(name)}</div>`:'') + `<table class="roster">${head}${ro.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table>`
        + `<div class="rsum">${sizes.map(s=>`${esc(s.k)}：${s.n}`).join('　')}${sizes.length?'　':''}<b>共 ${ro.count} ${u}</b></div>`;
    } else
    sz = (name?`<div class="iname">${esc(name)}</div>`:'') + `<div class="szl">` + sizes.map(s=>`<div>${esc(s.k)}：${s.n} ${u}</div>`).join('') + `<div>共 ${itemSum(it)} ${u}</div></div>`;
    const list=(it.imgs||[]).filter(x=>itemSrc(x));
    const im = list.length ? list.map((x,i)=>{const w=imgW(x); return `<img src="${esc(itemSrc(x))}" alt="稿圖 ${i+1}" style="width:${w<100?`calc(${w}% - 4px);margin-inline:2px`:'100%'}">`;}).join('') : `<div class="noimg">尚未放稿圖</div>`;
    return `<table class="itbl${ro?' hasro':''}"><tr><td class="img">${im}</td><td class="sz">${sz}</td></tr></table>`;
  }).join('');
  h += rows;
  return h;
}

function renderPreview(){
  const sum = totalNum(cur);
  const q = orderQty(cur.money);
  const manual = String(cur.count||'').trim();
  const c = $('check'); const msgs = [];
  const multi = cur.items.length>1;
  if(q!=null && sum && q!==sum) msgs.push(`${multi?'所有品項':'尺寸'}加總 ${sum}，但金額資料寫數量 ${q}`);
  if(manual && sum && +manual!==sum) msgs.push(`衣服件數填 ${manual}，但尺寸加總 ${sum}`);
  if(msgs.length){c.className='check bad';c.textContent='⚠ '+msgs.join('；');}
  else if(sum){c.className='check good';c.textContent='✓ 件數對得上'+(multi?`（共 ${totalText(cur)}）`:'');}
  else {c.className='check';c.textContent='';}
  $('sheet').innerHTML = sheetHTML(cur, mode);
  renderCalcHint();
  if($('c-res')) renderCalcResult();
  $('fh-title').textContent = cur.user.trim() ? displayName(cur) : '（未命名訂單）';
}
/* ---------- 品項表單 ---------- */
function itemCardHTML(it,i,n){
  return `<div class="item" data-i="${i}">
    <div class="ihead"><strong>品項 ${i+1}</strong>${n>1?`<button data-act="rmitem" class="danger">移除品項</button>`:''}</div>
    <input type="text" class="i-name" id="i-name-${i}" value="${esc(it.name||'')}" placeholder="品項名稱（可空白，例如：學生套裝、老師上衣）" aria-label="品項 ${i+1} 名稱">
    <textarea class="i-size" id="i-size-${i}" rows="4" placeholder="S：1 件&#10;M*8&#10;L×10 套" aria-label="品項 ${i+1} 尺寸">${esc(it.size||'')}</textarea>
    <div class="chips"></div>

/* ---------- 稿圖 ---------- */
function shrink(file,maxW=1400,q=0.85){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file); const im=new Image();
    im.onload=()=>{
      const s=Math.min(1,maxW/im.naturalWidth);
      const c=document.createElement('canvas'); c.width=Math.round(im.naturalWidth*s); c.height=Math.round(im.naturalHeight*s);
      const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(im,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b=>res({blob:b,canvas:c}),'image/jpeg',q);
    };
    im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('讀不到這張圖'));};
    im.src=url;
  });
}

  dropMsg(i,'上傳中…');
  try{

    let item=null;
    if(assets){
      try{ const r=await assets.upload(blob,{type:'image/jpeg'}); item={id:r.id}; }catch(e){}
    }
    if(!item){

      let q=0.8, w=1000, data;

/* ---------- 從客戶的 Word 匯入 ---------- */
function wordMsg(i,t,bad){ const el=itemEl(i); if(!el) return; const m=el.querySelector('.wordmsg'); m.textContent=t; m.className='hint wordmsg'+(bad?' warn':' ok'); }
/* ---------- 讀舊版 .doc（Word 97-2003）---------- */
function docStream(cf,name){ const e=CFB.find(cf,name); return e&&e.content ? (e.content instanceof Uint8Array ? e.content : new Uint8Array(e.content)) : null; }
function docText(cf){
  const wd=docStream(cf,'WordDocument'); if(!wd) throw new Error('不是 Word 檔');
  const dv=new DataView(wd.buffer, wd.byteOffset, wd.byteLength);
  if(dv.getUint16(0,true)!==0xA5EC) throw new Error('不是 Word 檔');
  const flags=dv.getUint16(0x0A,true);
  if(flags & 0x0100) throw new Error('這個 Word 檔有密碼保護');
  const tbl=docStream(cf,(flags & 0x0200)?'1Table':'0Table'); if(!tbl) throw new Error('讀不到 Word 內容');
  const fcClx=dv.getUint32(0x01A2,true), lcbClx=dv.getUint32(0x01A6,true);
  const tv=new DataView(tbl.buffer, tbl.byteOffset, tbl.byteLength);
  let p=fcClx; const end=fcClx+lcbClx;
  while(p<end && tbl[p]===0x01){ p+=3+tv.getUint16(p+1,true); }
  if(tbl[p]!==0x02) throw new Error('讀不到 Word 內容');
  const lcb=tv.getUint32(p+1,true); p+=5;
  const n=(lcb-4)/12; const cps=[]; for(let k=0;k<=n;k++) cps.push(tv.getUint32(p+k*4,true));
  const pcdBase=p+(n+1)*4;
  const dec16=new TextDecoder('utf-16le'); let dec8; try{ dec8=new TextDecoder('windows-1252'); }catch(e){ dec8=new TextDecoder('latin1'); }
  let out='';
  for(let k=0;k<n;k++){
    const len=cps[k+1]-cps[k]; let fc=tv.getUint32(pcdBase+k*8+2,true);
    if(fc & 0x40000000){ fc=(fc & 0x3FFFFFFF)/2; out+=dec8.decode(wd.subarray(fc,fc+len)); }
    else out+=dec16.decode(wd.subarray(fc,fc+len*2));
  }
  // 拿掉功能變數代碼，保留顯示結果
  out=out.replace(/\x13[^\x13\x14\x15]*\x14/g,'').replace(/\x13[^\x13\x14\x15]*\x15/g,'').replace(/[\x14\x15]/g,'');
  return out.replace(/[\x01\x08\x0c\x1f]/g,'').replace(/\x0b/g,' ').replace(/\x1e/g,'-').replace(/\x02/g,'');
}
// 表格：每格以 \x07 結尾，每列最後多一個空的 \x07
function docTables(text){
  const tables=[]; let run=null;
  const re=/([^\x07]*)\x07/g; let m, lastEnd=0;
  const flush=()=>{ if(run&&run.length) tables.push(run); run=null; };
  while((m=re.exec(text))){
    let seg=m[1];
    if(m.index!==lastEnd) flush();
    if(seg.includes('\r')){
      const after=seg.slice(seg.lastIndexOf('\r')+1);
      const prevEmpty=!run || !run.length || run[run.length-1]==='';
      if(after.trim()==='' ) seg=seg.replace(/\r/g,' ');            // 格子裡最後多按了 Enter
      else if(prevEmpty){ if(run && run.length) flush(); seg=after; } // 表格前面的文字，或新的表格開始
      else seg=seg.replace(/\r/g,' ');                                // 同一格裡有好幾行
    }
    if(!run) run=[];
    run.push(seg.replace(/\s+/g,' ').trim());
    lastEnd=re.lastIndex;
  }
  flush();
  const out=[];
  for(const segs of tables){
    let L=0;
    for(let l=2;l<=30;l++){
      if(segs.length%l) continue;
      let ok=true; for(let r=0;r<segs.length/l;r++){ if(segs[r*l+l-1]!==''){ok=false;break;} }
      if(ok && segs.some((s,ix)=>ix%l!==l-1 && s)){ L=l; break; }
    }
    if(!L) continue;
    const rows=[]; for(let r=0;r<segs.length/L;r++) rows.push(segs.slice(r*L,r*L+L-1));
    out.push(rows);
  }
  return out;
}
// 圖片：在檔案內容裡找 PNG / JPEG
async function docImages(cf){
  const found=[]; const seen=new Set();
  const streams=['Data','WordDocument'].map(n=>docStream(cf,n)).filter(Boolean);
  for(const b of streams){
    for(let i=0;i<b.length-8;i++){
      if(b[i]===0x89&&b[i+1]===0x50&&b[i+2]===0x4E&&b[i+3]===0x47&&b[i+4]===0x0D&&b[i+5]===0x0A){
        for(let j=i+8;j<b.length-8;j++){ if(b[j]===0x49&&b[j+1]===0x45&&b[j+2]===0x4E&&b[j+3]===0x44){ const e=j+8; const key=(e-i)+':'+b[i+20]; if(!seen.has(key)){seen.add(key); found.push({type:'image/png',bytes:b.slice(i,e)});} i=e-1; break; } }
      } else if(b[i]===0xFF&&b[i+1]===0xD8&&b[i+2]===0xFF&&(b[i+3]&0xF0)===0xE0){
        let j=i+2, e=-1;
        // 依 JPEG 區段長度跳到影像資料，再找結尾 FFD9
        while(j<b.length-4){
          if(b[j]!==0xFF){ break; }
          if(b[j+1]===0xFF){ j++; continue; }
          const mk=b[j+1]; const len=(b[j+2]<<8)|b[j+3];
          if(mk===0xDA){ j+=2+len; while(j<b.length-1){ if(b[j]===0xFF&&b[j+1]===0xD9){ e=j+2; break; } j++; } break; }
          j+=2+len;
        }
        if(e>0){ const key=(e-i)+':'+b[i+30]; if(!seen.has(key)){seen.add(key); found.push({type:'image/jpeg',bytes:b.slice(i,e)});} i=e-1; }
      }
    }
  }
  // 太小的通常是圖示或縮圖，略過
  const ok=[];
  for(const f of found){ if(f.bytes.length<3000) continue; try{ const bm=await createImageBitmap(new Blob([f.bytes],{type:f.type})); if(bm.width>=80&&bm.height>=80) ok.push(f); bm.close&&bm.close(); }catch(e){} }
  return ok;
}

async function importDocx(file,i=activeItem){
  if(!file) return;
  if(!/\.docx?$/i.test(file.name||'')){ wordMsg(i,'請選 Word 檔（檔名結尾是 .doc 或 .docx）',true); return; }
  wordMsg(i,'讀取 Word 中…');
  try{
    const head=new Uint8Array(await file.slice(0,4).arrayBuffer());
    const isOld = head[0]===0xD0 && head[1]===0xCF && head[2]===0x11 && head[3]===0xE0;
    let tables=[], imageFiles=[], loose=[];
    if(isOld){
      if(!window.CFB) throw new Error('舊版 Word 元件沒載入，請重新整理');
      const cf=CFB.read(new Uint8Array(await file.arrayBuffer()),{type:'array'});
      const txt=docText(cf); tables=docTables(txt);
      loose=txt.split('\r').map(l=>l.slice(l.lastIndexOf('\x07')+1).trim()).filter(Boolean);
      const imgs=await docImages(cf);
      imageFiles=imgs.map((x,k)=>new File([x.bytes],`image${k+1}.${x.type==='image/png'?'png':'jpg'}`,{type:x.type}));
    } else {
      if(!window.JSZip) throw new Error('Word 元件沒載入，請重新整理');
      const zip=await JSZip.loadAsync(file);
      const xf=zip.file('word/document.xml'); if(!xf) throw new Error('不是 Word 檔');
      const doc=new DOMParser().parseFromString(await xf.async('string'),'application/xml');
      const W='http://schemas.openxmlformats.org/wordprocessingml/2006/main';
      const kids=(el,name)=>[...el.childNodes].filter(n=>n.namespaceURI===W&&n.localName===name);
      const cellText=tc=>[...tc.getElementsByTagNameNS(W,'p')].map(p=>{ let t=''; p.querySelectorAll('*').forEach(n=>{ if(n.namespaceURI!==W) return; if(n.localName==='t') t+=n.textContent; else if(n.localName==='tab'||n.localName==='br') t+=' '; }); return t; }).join(' ').replace(/[\t\s]+/g,' ').trim();
      tables=[...doc.getElementsByTagNameNS(W,'tbl')].map(tbl=>kids(tbl,'tr').map(tr=>kids(tr,'tc').map(cellText)));
      const body=doc.getElementsByTagNameNS(W,'body')[0];
      if(body) loose=kids(body,'p').map(p=>{ let t=''; p.querySelectorAll('*').forEach(n=>{ if(n.namespaceURI!==W) return; if(n.localName==='t') t+=n.textContent; else if(n.localName==='tab') t+='\t'; }); return t.trim(); }).filter(Boolean);
      const media=Object.keys(zip.files).filter(n=>/^word\/media\/.+\.(png|jpe?g|gif|bmp|webp)$/i.test(n)).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
      for(const n of media){ const blob=await zip.file(n).async('blob'); const ext=n.split('.').pop().toLowerCase(); imageFiles.push(new File([blob],n.split('/').pop(),{type:ext==='jpg'?'image/jpeg':'image/'+ext})); }
    }
    tables=tables.map(rows=>rows.filter(r=>r.some(c=>c))).filter(rows=>rows.length>=2);
    const parsed=tables.map(rows=>({rows, ro:parseRoster(rows.map(r=>r.join('\t')).join('\n'))})).filter(x=>x.ro&&x.ro.sizeCol>=0);
    let rosterText=''; const extra=[];
    if(parsed.length){
      // 欄數一樣的名單表格合併（客戶有時會拆成好幾個表格）
      const main=parsed.reduce((a,b)=>b.ro.count>a.ro.count?b:a);
      const same=parsed.filter(x=>x.ro.ncol===main.ro.ncol);
      const lines=[];
      const hdr=(same.find(x=>x.ro.header)||{}).ro;
      if(hdr&&hdr.header) lines.push(hdr.header.join('\t'));
      same.forEach(x=>x.ro.rows.forEach(r=>lines.push(r.join('\t'))));
      // 表格外面另外打的人（例如「老師的    潔    L」）也加進名單
      const nc=main.ro.ncol, sc=main.ro.sizeCol;
      loose.forEach(l=>{
        const tk=l.split(/\t+|\s{2,}|　+/).map(x=>x.trim()).filter(Boolean);
        if(tk.length<2 || tk.length>nc || !SIZE_RE.test(tk[tk.length-1].replace(/\s/g,''))) return;
        const row=Array(nc).fill(''); const size=tk.pop(); row[sc]=size;
        const free=[...Array(nc).keys()].filter(k=>k!==sc);
        // 從尺寸欄前面的欄位往回填（名字通常在尺寸前一欄）
        const slots=free.slice(-tk.length); tk.forEach((v,k)=>row[slots[k]]=v);
        lines.push(row.join('\t')); extra.push(tk.concat(size).join(' '));
      });
      rosterText=lines.join('\n');
    }
    const it=cur.items[i]; const room=Math.max(0,MAX_IMGS-(it.imgs||[]).length);
    let added=0;
    for(const f of imageFiles.slice(0,room)){ await loadFile(f,i); added++; }
    if(rosterText){ it.roster=rosterText; const ta=$('i-roster-'+i); if(ta){ ta.value=rosterText; ta.closest('details').open=true; } }
    updateItemUI(i); renderPreview(); scheduleSave();
    const ro=rosterText?parseRoster(rosterText):null;
    const parts=[];
    parts.push(ro?`名單 ${ro.count} 件`:'沒找到有尺寸的名單表格');
    parts.push(added?`圖片 ${added} 張`:(imageFiles.length?`圖片已滿 ${MAX_IMGS} 張，沒有再加`:'檔案裡沒有圖片，稿圖請另外放'));
    if(extra.length) parts.push(`表格外另外加了 ${extra.length} 筆（${extra.slice(0,3).join('、')}${extra.length>3?'…':''}）`);
    if(added && imageFiles.length>added) parts.push(`另有 ${imageFiles.length-added} 張沒放（每個品項最多 ${MAX_IMGS} 張）`);
    wordMsg(i,'已匯入：'+parts.join('，')+'。請檢查一下名單和圖片', !ro);
  }catch(err){ wordMsg(i,'讀不到這個 Word 檔：'+(err.message||err),true); }
}

/* Word (.docx) */
const FONT='Microsoft JhengHei';
function X(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function wr(t,o={}){
  const sz=o.sz||24;
  return `<w:r><w:rPr><w:rFonts w:ascii="${FONT}" w:hAnsi="${FONT}" w:eastAsia="${FONT}" w:cs="${FONT}"/>${o.b?'<w:b/>':''}${o.red?'<w:color w:val="FF0000"/>':''}<w:sz w:val="${sz}"/><w:szCs w:val="${sz}"/>${o.hl?'<w:highlight w:val="yellow"/>':''}</w:rPr><w:t xml:space="preserve">${X(t)}</w:t></w:r>`;
}
function fr(line,o={}){ return line.split(/(\*\*.+?\*\*)/).filter(Boolean).map(p=>/^\*\*.+\*\*$/.test(p)?wr(p.slice(2,-2),{...o,red:true}):wr(p,o)).join(''); }
function wp(runs,after=0){ return `<w:p><w:pPr><w:spacing w:before="0" w:after="${after}" w:line="360" w:lineRule="auto"/></w:pPr>${runs}</w:p>`; }
function lines(txt,o){ return (txt||'').trim().split('\n').map(l=>wp(fr(l,o))).join(''); }
function drawing(cx,cy,n=1){
  return `<w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${cx}" cy="${cy}"/><wp:docPr id="${n}" name="稿圖${n}"/><a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="${n}" name="image${n}.jpeg"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="rIdImg${n}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r>`;
}
function imageJpeg(src){
  return new Promise((res,rej)=>{
    const im=new Image();
    im.onload=()=>{
      const c=document.createElement('canvas'); c.width=im.naturalWidth; c.height=im.naturalHeight;
      const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(im,0,0);
      c.toBlob(async b=>{ if(!b) return rej(new Error('圖片轉換失敗')); res({buf:await b.arrayBuffer(),w:c.width,h:c.height}); },'image/jpeg',0.92);
    };
    im.onerror=()=>rej(new Error('讀不到稿圖'));
    im.src=src;
  });
}
function nameRuns(o){ const r=rushParts(o); return (r.pre?wr(r.pre,{red:true,b:true}):'')+wr(String(o.user||'').trim())+(r.post?wr(r.post,{red:true,b:true}):''); }
async function buildDocx(o,which){
  const dash=wp(wr(DASH,{}));
  let body='';
  if(which==='cus'){
    body+=wp(wr('用戶：')+nameRuns(o))+dash+(o.ship.trim()?lines(o.ship)+dash:'')+(o.money.trim()?lines(o.money)+dash:'');
    body+=wp(wr('以下為印製單請務必詳細確認')+wr('件數/尺寸/圖稿',{hl:true})+wr('是否正確'));
  } else {
    body+=wp(wr('工廠印製單',{b:true,sz:28}),80);
    if(o.facname && o.user.trim()) body+=wp(wr('訂單：')+nameRuns(o));
    else if(o.rush) body+=wp(nameRuns(o));
  }
  body+=wp(wr('衣服件數：'+totalText(o)));
  body+=wp(wr('衣服材質：')+wr(o.mat.trim(),{red:true,hl:true,b:true}), which==='fac'&&o.note.trim()?0:80);
  if(which==='fac' && o.note.trim()) body+=lines('備註：'+o.note.trim())+wp('',80);
  const al=alertLines(o);
  if(al.length){
    const bdr=['top','left','bottom','right'].map(s=>`<w:${s} w:val="single" w:sz="18" w:space="4" w:color="FF0000"/>`).join('');
    body+=al.map(l=>`<w:p><w:pPr><w:pBdr>${bdr}</w:pBdr><w:spacing w:before="0" w:after="0" w:line="360" w:lineRule="auto"/><w:ind w:left="100" w:right="100"/></w:pPr>${wr('★★★'+l+'★★★',{red:true,b:true,sz:28})}</w:p>`).join('')+wp('',80);
  }

  const imgs=[]; const EMU=360000; let rows='';
  for(const it of itemsOf(o)){
    let imgCell='';
    const list=(it.imgs||[]).filter(x=>itemSrc(x));
    // 同一行放得下的圖（大小加起來不超過 100%）就並排
    let line=[], lineW=0; const flush=()=>{ if(line.length){ imgCell+=`<w:p><w:pPr><w:spacing w:before="${imgCell?80:0}" w:after="0"/><w:jc w:val="center"/></w:pPr>${line.join(wr(' ',{sz:8}))}</w:p>`; } line=[]; lineW=0; };
    for(let i=0;i<list.length;i++){
      const w=imgW(list[i]);
      const img=await imageJpeg(itemSrc(list[i])); imgs.push(img); const n=imgs.length;
      const cellCm=parseRoster(it.roster)?8.4:12.6;
      let cx=Math.round(cellCm*EMU*w/100*(w<100?0.97:1)), cy=Math.round(cx*img.h/img.w);
      const maxH=Math.round(17*EMU*w/100); if(cy>maxH){ cx=Math.round(cx*maxH/cy); cy=maxH; }
      if(lineW+w>100) flush();
      line.push(drawing(cx,cy,n)); lineW+=w;
    }
    flush();
    if(!list.length) imgCell=wp(wr('（尚未放稿圖）',{}));
    const u=unitOf(it); const name=(it.name||'').trim(); const ro=parseRoster(it.roster);
    if(ro){
      const cw=Math.floor(5006/ro.ncol); const tp=(t,b)=>`<w:p><w:pPr><w:spacing w:before="0" w:after="0" w:line="240" w:lineRule="auto"/><w:jc w:val="center"/></w:pPr>${wr(t,{sz:20,b})}</w:p>`;
      const rrow=(r,b)=>`<w:tr>${r.map(c=>`<w:tc><w:tcPr><w:tcW w:w="${cw}" w:type="dxa"/></w:tcPr>${tp(c,b)}</w:tc>`).join('')}</w:tr>`;
      const rb=['top','left','bottom','right','insideH','insideV'].map(s=>`<w:${s} w:val="single" w:sz="4" w:space="0" w:color="666666"/>`).join('');
      const rt=`<w:tbl><w:tblPr><w:tblW w:w="${cw*ro.ncol}" w:type="dxa"/><w:tblBorders>${rb}</w:tblBorders><w:tblLayout w:type="fixed"/><w:tblCellMar><w:left w:w="40" w:type="dxa"/><w:right w:w="40" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid>${Array(ro.ncol).fill(`<w:gridCol w:w="${cw}"/>`).join('')}</w:tblGrid>${ro.header?rrow(ro.header,true):''}${ro.rows.map(r=>rrow(r,false)).join('')}</w:tbl>`;
      const sumTxt=itemSizes(it).map(x=>`${x.k}：${x.n}`).join('　')+'　共 '+ro.count+' '+u;
      const cell=(name?wp(wr(name,{b:true,sz:24}),60):'')+rt+wp(wr(sumTxt,{sz:22,b:true}),0);
      rows+=`<w:tr><w:tc><w:tcPr><w:tcW w:w="5000" w:type="dxa"/></w:tcPr>${imgCell}</w:tc><w:tc><w:tcPr><w:tcW w:w="5206" w:type="dxa"/><w:gridSpan w:val="2"/></w:tcPr>${cell}</w:tc></w:tr>`;
      continue;
    }
    const szCell=(name?wp(wr(name,{b:true,sz:28}),200):'')+parseSizes(it.size).map(x=>wp(wr(`${x.k}：${x.n} ${u}`,{sz:28}),260)).join('')+wp(wr(`共 ${itemSum(it)} ${u}`,{sz:28}));
    rows+=`<w:tr><w:trPr><w:cantSplit/></w:trPr><w:tc><w:tcPr><w:tcW w:w="7371" w:type="dxa"/><w:gridSpan w:val="2"/></w:tcPr>${imgCell}</w:tc><w:tc><w:tcPr><w:tcW w:w="2835" w:type="dxa"/></w:tcPr>${szCell}</w:tc></w:tr>`;
  }
  const bd=['top','left','bottom','right','insideH','insideV'].map(s=>`<w:${s} w:val="single" w:sz="10" w:space="0" w:color="333333"/>`).join('');
  body+=`<w:tbl><w:tblPr><w:tblW w:w="10206" w:type="dxa"/><w:tblBorders>${bd}</w:tblBorders><w:tblLayout w:type="fixed"/><w:tblCellMar><w:top w:w="80" w:type="dxa"/><w:left w:w="100" w:type="dxa"/><w:bottom w:w="80" w:type="dxa"/><w:right w:w="100" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid><w:gridCol w:w="5000"/><w:gridCol w:w="2371"/><w:gridCol w:w="2835"/></w:tblGrid>${rows}</w:tbl>`;
  body+=wp('');

  const doc=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"><w:body>${body}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="850" w:right="850" w:bottom="850" w:left="850" w:header="425" w:footer="425" w:gutter="0"/></w:sectPr></w:body></w:document>`;
  const zip=new JSZip();
  zip.file('[Content_Types].xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="jpeg" ContentType="image/jpeg"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>`);
  zip.file('_rels/.rels',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`);
  zip.file('word/_rels/document.xml.rels',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${imgs.map((_,i)=>`<Relationship Id="rIdImg${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/image${i+1}.jpeg"/>`).join('')}</Relationships>`);
  zip.file('word/document.xml',doc);
  imgs.forEach((img,i)=>zip.file(`word/media/image${i+1}.jpeg`,img.buf));
  return zip.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}

function sheetText(){
  const o=cur; const strip=s=>s.replace(/\*\*/g,'');
  const L=[];
  if(mode==='cus') L.push('用戶：'+displayName(o),DASH,strip(o.ship.trim()),DASH,strip(o.money.trim()),DASH,'以下為印製單請務必詳細確認件數/尺寸/圖稿是否正確');
  else { L.push('【工廠印製單】'); if(o.facname) L.push('訂單：'+displayName(o)); else if(o.rush) L.push(displayName(o)); }
  L.push('衣服件數：'+totalText(o),'衣服材質：'+o.mat.trim());
  if(mode==='fac' && o.note.trim()) L.push('備註：'+strip(o.note.trim()));
  alertLines(o).forEach(l=>L.push('★★★'+l+'★★★'));
  itemsOf(o).forEach((it,i)=>{ const u=unitOf(it); L.push(''); if((it.name||'').trim()) L.push('【'+it.name.trim()+'】'); else if(itemsOf(o).length>1) L.push('【品項 '+(i+1)+'】');
    const ro=parseRoster(it.roster);
    if(ro){ if(ro.header) L.push(ro.header.join('\t')); ro.rows.forEach(r=>L.push(r.join('\t'))); L.push(itemSizes(it).map(x=>x.k+'：'+x.n).join('　')+'　共 '+ro.count+' '+u); }
    else { parseSizes(it.size).forEach(x=>L.push(x.k+'：'+x.n+' '+u)); L.push('共 '+itemSum(it)+' '+u); } });
  return L.join('\n');
}

/* ---------- 本機儲存（IndexedDB，只存在這台電腦的瀏覽器） ---------- */
function idbOpen(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open('blumon-print-sheet',2);
    r.onupgradeneeded=()=>{const d=r.result;
      if(!d.objectStoreNames.contains('orders')) d.createObjectStore('orders',{keyPath:'id'});
      if(!d.objectStoreNames.contains('settings')) d.createObjectStore('settings');};
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
function makeLocalDb(idb){
  let listener=null;
  const tx=(mode,fn)=>new Promise((res,rej)=>{const t=idb.transaction('orders',mode);const st=t.objectStore('orders');const q=fn(st);t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);});
  const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  async function notify(){
    if(!listener) return;
    const all=(await tx('readonly',st=>st.getAll()))||[];
    all.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
    listener({docs:all.map(o=>({id:o.id,data:()=>{const c={...o};delete c.id;return c;}}))});
  }
  const docRef=id=>({id,
    set:data=>tx('readwrite',st=>st.put({...data,id})).then(notify),
    delete:()=>tx('readwrite',st=>st.delete(id)).then(notify)});
  return {
    collection:()=>({doc:id=>docRef(id||newId()), orderBy(){return this}, limit(){return this},
      onSnapshot(fn){listener=fn;notify();return()=>{listener=null}}}),
    doc:path=>docRef(path.split('/')[1]),
    putMany:list=>tx('readwrite',st=>{list.forEach(o=>st.put(o));}).then(notify),
  };
}
/* 存檔：Chrome / Edge 每次都跳出「另存新檔」視窗，可以選資料夾和檔名 */
let dirHandle=null, idbRef=null;
function alertDir(m){const c=$('check');c.className='check bad';c.textContent=m;}
function setting(mode,fn){return new Promise((res,rej)=>{if(!idbRef)return res(null);const t=idbRef.transaction('settings',mode);const q=fn(t.objectStore('settings'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);});}
const TYPES={docx:{description:'Word 文件',accept:{'application/vnd.openxmlformats-officedocument.wordprocessingml.document':['.docx']}},
  png:{description:'PNG 圖片',accept:{'image/png':['.png']}},
  json:{description:'備份檔',accept:{'application/json':['.json']}}};
downloads={save:async({filename,data})=>{
  const blob=data instanceof Blob?data:new Blob([data]);
  if('showSaveFilePicker' in window){
    const ext=filename.split('.').pop().toLowerCase();
    let h;
    try{ h=await window.showSaveFilePicker({suggestedName:filename,id:'blumon-print',types:TYPES[ext]?[TYPES[ext]]:undefined}); }
    catch(e){ if(e&&e.name==='AbortError') throw {code:'declined'}; h=null; }
    if(h){ const w=await h.createWritable(); await w.write(blob); await w.close(); return {status:'saved',where:h.name}; }
  }
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
  return {status:'saved'};
}};
$('ov-save').hidden=false;

/* 備份 */
$('b-export').onclick=async()=>{
  await flushSave();
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  const name=`印製單備份_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}.json`;
  await offer(name, JSON.stringify({app:'blumon-print-sheet',v:1,orders},null,0), $('b-export'));
};
$('b-import').onclick=()=>$('f-backup').click();
$('f-backup').addEventListener('change',async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f||!db) return;
  try{
    const j=JSON.parse(await f.text()); const list=(j.orders||[]).filter(o=>o&&o.id);
    await db.putMany(list); flash($('b-import'),`已匯入 ${list.length} 張`);
  }catch(err){ flash($('b-import'),'檔案格式不對',3000); }
});

/* ---------- 啟動 ---------- */
fillForm();
(async()=>{
  try{ idbRef=await idbOpen(); db=makeLocalDb(idbRef); }catch(e){ db=null; }
  if(!db){ $('dbstatus').textContent='這個瀏覽器不能儲存訂單（可能是無痕模式），還是可以出圖和下載 Word。'; renderList(); return; }
  let first=true;
  db.collection('orders').onSnapshot(snap=>{
    orders = snap.docs.map(s=>({id:s.id, ...s.data()}));
    $('dbstatus').textContent = `共 ${orders.length} 張訂單（存在這台電腦）`;
    if(first){
      first=false;
      if(!curId && !dirty && orders[0]){ curId=orders[0].id; cur=toCur(orders[0]); fillForm(); }
    }
    renderList();
  });
})();
